[project]
name = "l1-2026"
description = "L1 2026"
version = "2026"
authors = [
    {name = "Oscar Llorente Gonzalez", email = "ollorente@comillas.edu"},
]
readme = "README.md"
requires-python = "==3.12.*"

[tool.black]
line-length = 88
exclude = '''
/(
  \.venv
)/
'''

[tool.flake8]
max-line-length = 88
extend-ignore = "E203, W503"
exclude = [
    ".venv/",
    "data/"
]

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    ".venv/",
    "data/"
]
cache_dir = "/dev/null"

[tool.pylint]
max-line-length = 88
disable = "R0801,R0912,R0913,R0914,R0915,R0917,R1711,R1732,W1203,R0902,W0707,C0114"

[tool.isort]
profile = "black"
import_heading_stdlib = "Standard libraries"
import_heading_thirdparty = "3pps"
import_heading_firstparty = "Own modules"
line_length = 88
